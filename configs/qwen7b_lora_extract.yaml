# Draft config. Do not run until Phase 1-3 Go/No-Go passes.
base_model: Qwen/Qwen2.5-7B-Instruct
task: chinese_medical_report_structuring
training_policy: public_or_synthetic_only
output_dir: /home/syin94/scratch/lora_health/runs/qwen7b_lora_extract

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_seq_length: 4096
  learning_rate: 2.0e-4
  batch_size: 1
  gradient_accumulation_steps: 16
  epochs: 3
  bf16: true
  seed: 42

eval:
  gold_dir: eval/gold
  metrics_output: results/lora_extract/metrics.json
