name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_workflow.py
      - run: python -m unittest discover -s tests -v
      - name: Reject tracked local health databases or private-data patterns
        shell: bash
        run: |
          if git ls-files | grep -E '(^tmp/|^data/private/|\.real\.|\.pii\.|(^|/)(raw_outputs|predictions)(\.|/)|\.log$|\.(sqlite|sqlite-wal|sqlite-shm|db)$)'; then
            echo "Tracked private/local/generated artifact detected"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/coval-health-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/coval-health-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/coval-health-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/coval-health-web/package-lock.json
      - run: python -m pip install -r ../../requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          COVAL_PYTHON: python
